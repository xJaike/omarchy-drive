<title id="title">3 · Configure Google Auth Platform</title>
<desc id="desc">Original setup diagram, not a Google Cloud screenshot. Read the linked setup guide for commands and current official references.</desc>
<rect width="1280" height="760" rx="18" fill="#f2f6fa"/>
<rect x="0" y="0" width="1280" height="12" fill="#166554"/>
<text x="48" y="58" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="700" fill="#166554">OMARCHY DRIVE · SETUP GUIDE</text>
<text x="48" y="104" font-family="DejaVu Sans, sans-serif" font-size="32" font-weight="700" fill="#15283a">3 · Configure Google Auth Platform</text>
<text x="48" y="139" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#35465b">Example for a personal account using an External app in Testing.</text>
<path d="M68 212V608" stroke="#b7d3ca" stroke-width="3"/>
<rect x="110" y="172" width="1122" height="116" rx="12" fill="#ffffff" stroke="#d8e2eb"/>
<circle cx="68" cy="212" r="22" fill="#166554"/>
<text x="61" y="219" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="700" fill="#ffffff">1</text>
<text x="134" y="199" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="700" fill="#166554">BRANDING</text>
<text x="134" y="232" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="700" fill="#15283a">Identify your app</text>
<text x="650" y="217" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#35465b">App name: Omarchy Drive Personal</text>
<text x="650" y="245" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#35465b">Choose support and contact emails.</text>
<rect x="110" y="304" width="1122" height="116" rx="12" fill="#ffffff" stroke="#d8e2eb"/>
<circle cx="68" cy="344" r="22" fill="#166554"/>
<text x="61" y="351" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="700" fill="#ffffff">2</text>
<text x="134" y="331" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="700" fill="#166554">AUDIENCE</text>
<text x="134" y="364" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="700" fill="#15283a">Allow your account to sign in</text>
<text x="650" y="349" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#35465b">Choose External for personal Gmail.</text>
<text x="650" y="377" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#35465b">Under Test users, add your account.</text>
<rect x="110" y="436" width="1122" height="116" rx="12" fill="#ffffff" stroke="#d8e2eb"/>
<circle cx="68" cy="476" r="22" fill="#166554"/>
<text x="61" y="483" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="700" fill="#ffffff">3</text>
<text x="134" y="463" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="700" fill="#166554">DATA ACCESS</text>
<text x="134" y="496" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="700" fill="#15283a">Add the Drive scope</text>
<text x="650" y="481" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#35465b">https://www.googleapis.com/auth/drive</text>
<text x="650" y="509" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#35465b">Review the broad read/write permission.</text>
<rect x="110" y="568" width="1122" height="116" rx="12" fill="#ffffff" stroke="#d8e2eb"/>
<circle cx="68" cy="608" r="22" fill="#166554"/>
<text x="61" y="615" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="700" fill="#ffffff">4</text>
<text x="134" y="595" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="700" fill="#166554">TESTING NOTE</text>
<text x="134" y="628" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="700" fill="#15283a">Refresh tokens can expire in 7 days</text>
<text x="650" y="613" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#35465b">Review publishing requirements for ongoing use.</text>
<text x="650" y="641" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#35465b">Publishing and Google verification are different.</text>
